<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Loan Service - Content & Lead Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- HEADER -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-900 border border-slate-800 p-6 rounded-3xl mb-8 shadow-xl">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-blue-600/20 text-blue-400 flex items-center justify-center text-2xl border border-blue-500/30">
                    <i class="fa-solid fa-pen-to-square"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">First Loan Service | Editor Panel</h1>
                    <p class="text-xs text-slate-400">Change website text, phone numbers & rates instantly</p>
                </div>
            </div>
            <a href="index.html" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 text-blue-400 font-bold px-4 py-2.5 rounded-xl border border-slate-700 transition">
                <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> View Live Site
            </a>
        </div>

        <!-- SITE CONTENT EDIT FORM -->
        <div class="bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl shadow-xl space-y-6">
            <h2 class="text-base font-bold text-amber-400 uppercase tracking-wider border-b border-slate-800 pb-3 flex items-center gap-2">
                <i class="fa-solid fa-sliders"></i> Edit Website Content
            </h2>

            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Top Announcement Bar Text</label>
                <input type="text" id="cfg_announce" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Contact Phone / WhatsApp Number</label>
                    <input type="text" id="cfg_phone" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Personal Loan Interest Rate Text</label>
                    <input type="text" id="cfg_pl_rate" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Business Loan Max Limit Text</label>
                    <input type="text" id="cfg_bl_limit" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase mb-1">Home Loan Interest Rate Text</label>
                    <input type="text" id="cfg_hl_rate" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500">
                </div>
            </div>

            <div class="pt-4 border-t border-slate-800 flex items-center justify-between">
                <button onclick="saveSiteContent()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-8 py-3.5 rounded-xl shadow-lg shadow-emerald-600/30 text-sm transition flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Save & Apply Changes
                </button>
                <span id="saveSuccessMsg" class="text-xs font-bold text-emerald-400 hidden">✓ Saved successfully!</span>
            </div>
        </div>
    </div>

    <script>
        // Load stored content on page open
        window.addEventListener('DOMContentLoaded', () => {
            const data = JSON.parse(localStorage.getItem('site_custom_content')) || {
                announce: "Authorized Multi-Banking Direct Selling Partner | Instant Sanctions",
                phone: "+91 96743 23575",
                pl_rate: "Starting @ 10.49%",
                bl_limit: "Up to ₹1 Crore",
                hl_rate: "Starting @ 8.40%"
            };

            document.getElementById('cfg_announce').value = data.announce;
            document.getElementById('cfg_phone').value = data.phone;
            document.getElementById('cfg_pl_rate').value = data.pl_rate;
            document.getElementById('cfg_bl_limit').value = data.bl_limit;
            document.getElementById('cfg_hl_rate').value = data.hl_rate;
        });

        // Save new content
        function saveSiteContent() {
            const newData = {
                announce: document.getElementById('cfg_announce').value,
                phone: document.getElementById('cfg_phone').value,
                pl_rate: document.getElementById('cfg_pl_rate').value,
                bl_limit: document.getElementById('cfg_bl_limit').value,
                hl_rate: document.getElementById('cfg_hl_rate').value
            };

            localStorage.setItem('site_custom_content', JSON.stringify(newData));

            const msg = document.getElementById('saveSuccessMsg');
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>
